    <script>
        async function fetchSheetData() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const sheetId = document.getElementById('sheetId').value.trim();
            const range = document.getElementById('range').value.trim();
            const errorDiv = document.getElementById('errorMessage');
            const resultsCard = document.getElementById('resultsCard');

            // Reset UI states
            errorDiv.style.display = 'none';
            resultsCard.style.display = 'none';

            if (!apiKey || !sheetId || !range) {
                showError('Please fill out all input parameters.');
                return;
            }

            const encodedRange = encodeURIComponent(range);
            
            // Fixed URL format using explicit concatenation
            const finalUrl = "https://googleapis.com" + sheetId + "/values/" + encodedRange + "?key=" + apiKey;

            try {
                const response = await fetch(finalUrl);
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error?.message || 'Failed to fetch spreadsheet data.');
                }

                if (!data.values || data.values.length === 0) {
                    throw new Error('Spreadsheet was found, but the requested range is empty.');
                }

                resultsCard.style.display = 'block';
                
                // Render Raw Array Structure
                document.getElementById('rawOutput').textContent = JSON.stringify(data, null, 2);

                // Render Formatted Key-Value Database Structure
                const databaseJson = convertRowsToObjects(data.values);
                document.getElementById('formattedOutput').textContent = JSON.stringify(databaseJson, null, 2);

            } catch (err) {
                showError(err.message);
            }
        }

        function convertRowsToObjects(rows) {
            const headers = rows[0]; 
            const dataRows = rows.slice(1); 

            return dataRows.map(row => {
                const record = {};
                headers.forEach((header, index) => {
                    record[header] = row[index] !== undefined ? row[index] : "";
                });
                return record;
            });
        }

        function showError(msg) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = msg;
            errorDiv.style.display = 'block';
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            if (tabName === 'formatted') {
                document.getElementById('formattedTab').classList.add('active');
                event.target.classList.add('active');
            } else {
                document.getElementById('rawTab').classList.add('active');
                event.target.classList.add('active');
            }
        }
    </script>
