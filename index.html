<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MINISTRY OF REPRODUCTION // UNIT DOSSIER</title>

  <!-- PWA & Mobile Viewport Styling -->
  <meta name="theme-color" content="#08090c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- Retro terminal fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- PapaParse for CSV parsing -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <style>
    :root {
      --bg-color: #07080a;
      --card-bg: rgba(13, 17, 23, 0.94);
      --accent-danger: #ff0055;  /* Flag / Area of concern / High Creativity */
      --cyan: #00ffcc;           /* HUD Cyan */
      --amber: #ffaa00;          /* Warning indicator */
      --text: #d0d7de;
      --text-muted: #6e7681;
      --border: rgba(0, 255, 204, 0.25);
      --danger-border: rgba(255, 0, 85, 0.45);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      font-family: 'Space Grotesk', -apple-system, sans-serif;
      letter-spacing: 0.3px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
      position: relative;
      overflow-x: hidden;
    }

    /* CRT Scanline & Grain Overlay */
    body::before {
      content: " ";
      position: fixed;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.45) 50%), 
                  linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
      background-size: 100% 3px, 3px 100%;
      pointer-events: none;
      z-index: 100;
    }

    /* Ambient background grid */
    .bg-grid {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background-image: 
        linear-gradient(to right, rgba(0, 255, 204, 0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 255, 204, 0.04) 1px, transparent 1px);
      background-size: 35px 35px;
      pointer-events: none;
      z-index: 0;
    }

    .dossier-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 520px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      box-shadow: 0 0 30px rgba(0, 255, 204, 0.12), inset 0 0 15px rgba(0, 0, 0, 0.9);
      padding: 26px 22px;
      backdrop-filter: blur(10px);
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .dossier-card.has-hazard {
      border-color: var(--danger-border);
      box-shadow: 0 0 35px rgba(255, 0, 85, 0.22), inset 0 0 20px rgba(0, 0, 0, 0.95);
    }

    /* Corner Framing Brackets */
    .dossier-card::before, .dossier-card::after {
      content: "";
      position: absolute;
      width: 14px;
      height: 14px;
      border-color: var(--cyan);
      pointer-events: none;
    }
    .dossier-card::before {
      top: -1px; left: -1px;
      border-top: 3px solid var(--cyan);
      border-left: 3px solid var(--cyan);
    }
    .dossier-card::after {
      bottom: -1px; right: -1px;
      border-bottom: 3px solid var(--cyan);
      border-right: 3px solid var(--cyan);
    }

    .dossier-card.has-hazard::before {
      border-top-color: var(--accent-danger);
      border-left-color: var(--accent-danger);
    }
    .dossier-card.has-hazard::after {
      border-bottom-color: var(--accent-danger);
      border-right-color: var(--accent-danger);
    }

    /* System Header */
    .system-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px dashed var(--border);
      padding-bottom: 12px;
      margin-bottom: 20px;
      font-size: 0.75rem;
      letter-spacing: 1px;
      color: var(--cyan);
    }

    .status-badge {
      background: rgba(0, 255, 204, 0.1);
      border: 1px solid var(--cyan);
      color: var(--cyan);
      padding: 2px 8px;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .status-badge.hazard {
      background: rgba(255, 0, 85, 0.2);
      border-color: var(--accent-danger);
      color: var(--accent-danger);
      animation: alertPulse 1.5s infinite;
    }

    @keyframes alertPulse {
      0%, 100% { opacity: 1; box-shadow: 0 0 8px rgba(255, 0, 85, 0.6); }
      50% { opacity: 0.4; box-shadow: none; }
    }

    /* Unit Identity Info */
    .unit-meta {
      margin-bottom: 20px;
    }

    .unit-identity {
      font-family: 'Chakra Petch', sans-serif;
      letter-spacing: 1.5px;
      font-size: 1.7rem;
      font-weight: 900;
      text-transform: uppercase;
      color: #fff;
      text-shadow: 0 0 12px rgba(0, 255, 204, 0.35);
      margin-bottom: 6px;
    }

    .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 24px;
      margin-top: 8px;
      background: rgba(0, 0, 0, 0.45);
      padding: 10px 12px;
      border-left: 3px solid var(--cyan);
      font-size: 0.85rem;
    }

    .meta-item span {
      display: block;
      color: var(--text-muted);
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .meta-item strong {
      color: #fff;
      font-weight: normal;
    }

    /* Aptitude Metrics List */
    .section-title {
      font-size: 0.75rem;
      color: var(--cyan);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 10px;
      margin-top: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-title::after {
      content: "";
      flex: 1;
      height: 1px;
      background: rgba(0, 255, 204, 0.15);
    }

    .stat-list {
      display: grid;
      gap: 8px;
      background: rgba(0, 0, 0, 0.35);
      padding: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.82rem;
      border-bottom: 1px dotted rgba(255, 255, 255, 0.08);
      padding-bottom: 5px;
      gap: 8px;
    }

    .stat-row:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .stat-label {
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-size: 0.78rem;
    }

    /* Star Visuals (Optimized for 10 stars) */
    .star-display {
      letter-spacing: 1.5px;
      font-size: 0.75rem;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
    }

    .star-filled {
      color: var(--cyan);
      text-shadow: 0 0 5px rgba(0, 255, 204, 0.6);
    }

    .star-empty {
      color: rgba(255, 255, 255, 0.12);
    }

    /* Danger Star Override for Creativity */
    .stat-row.creativity-alert {
      background: rgba(255, 0, 85, 0.12);
      border-left: 3px solid var(--accent-danger);
      padding: 6px 8px;
      margin: 2px -4px;
    }

    .stat-row.creativity-alert .stat-label {
      color: #ff85a1;
      font-weight: bold;
    }

    .stat-row.creativity-alert .star-filled {
      color: var(--accent-danger);
      text-shadow: 0 0 8px rgba(255, 0, 85, 0.8);
    }

    .stat-row.creativity-alert .warning-tag {
      color: var(--accent-danger);
      font-size: 0.65rem;
      margin-left: 4px;
      font-weight: bold;
      letter-spacing: 0.5px;
    }

    /* Behavioral / Appraisal Notes */
    .alert-panel {
      margin-top: 14px;
      padding: 12px;
      background: rgba(0, 0, 0, 0.4);
      border-left: 3px solid var(--amber);
      font-size: 0.85rem;
    }

    .alert-panel.danger {
      border-left-color: var(--accent-danger);
      background: rgba(255, 0, 85, 0.05);
    }

    .alert-panel.hazard-flag {
      border-left-color: var(--accent-danger);
      background: rgba(255, 0, 85, 0.12);
      border: 1px solid var(--accent-danger);
      border-left: 4px solid var(--accent-danger);
      animation: alertPulse 3s infinite;
    }

    .alert-panel .label {
      display: block;
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    .alert-panel.danger .label,
    .alert-panel.hazard-flag .label {
      color: var(--accent-danger);
      font-weight: bold;
    }

    .alert-panel.amber .label {
      color: var(--amber);
    }

    .alert-panel p {
      line-height: 1.5;
      color: #c9d1d9;
    }

    /* Terminal Status Messages */
    .terminal-message {
      text-align: center;
      padding: 40px 10px;
      color: var(--cyan);
    }

    .terminal-message .glitch-alert {
      color: var(--accent-danger);
      font-size: 1.2rem;
      margin-bottom: 10px;
      font-family: 'Orbitron', sans-serif;
    }
  </style>
</head>
<body>

  <div class="bg-grid"></div>

  <div class="dossier-card" id="app">
    <div class="terminal-message">
      <p>INITIALIZING DATA LINK...</p>
      <p style="font-size: 0.8rem; color: var(--text-muted); margin-top: 8px;">DECRYPTING CITIZEN REGISTRY</p>
    </div>
  </div>

  <script>
    // -------------------------------------------------------------
    // PASTE YOUR PUBLISHED GOOGLE SHEET CSV URL HERE:
    // -------------------------------------------------------------
    const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRlmhjhIPa6cbXQecsfKAlLoLilr1NAV2QGqepe_rf9_E3CTB-T-Jlpd1rge93AsT-2CtXoh5spt3qY/pub?output=csv";

    // Star rating scale
    const MAX_STARS = 10;

    function getQueryParam(param) {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(param);
    }

    // Convert numeric score into filled and empty stars out of 10
    function formatStars(scoreRaw, maxStars = MAX_STARS) {
      if (scoreRaw === undefined || scoreRaw === null) {
        return `<span class="star-display"><span class="star-empty">${'☆'.repeat(maxStars)}</span></span>`;
      }
      // Extract number even if formatted like "7/10" or "8 "
      const numMatch = scoreRaw.toString().match(/\d+/);
      const score = numMatch ? parseInt(numMatch[0], 10) : NaN;

      if (isNaN(score) || score <= 0) {
        return `<span class="star-display"><span class="star-empty">${'☆'.repeat(maxStars)}</span></span>`;
      }
      const clamped = Math.min(Math.max(score, 0), maxStars);
      const filled = '★'.repeat(clamped);
      const empty = '☆'.repeat(maxStars - clamped);
      return `<span class="star-display"><span class="star-filled">${filled}</span><span class="star-empty">${empty}</span></span>`;
    }

    function renderError(title, subtitle) {
      document.getElementById('app').innerHTML = `
        <div class="system-header">
          <span>SYS.ERR // 404</span>
          <span class="status-badge hazard">ERROR</span>
        </div>
        <div class="terminal-message">
          <div class="glitch-alert">${title}</div>
          <p style="font-size: 0.85rem; color: var(--text-muted);">${subtitle}</p>
        </div>
      `;
    }

    function renderDossier(data) {
      const keys = Object.keys(data);

      // Robust fuzzy search that strips underscores, spaces, hyphens and special chars
      const getVal = (possibleNames) => {
        const names = Array.isArray(possibleNames) ? possibleNames : [possibleNames];
        for (const name of names) {
          const normTarget = name.toLowerCase().replace(/[^a-z0-9]/g, '');
          const found = keys.find(k => k.toLowerCase().replace(/[^a-z0-9]/g, '').includes(normTarget));
          if (found && data[found] !== undefined && data[found] !== null && data[found].toString().trim() !== '') {
            return data[found].toString().trim();
          }
        }
        return '---';
      };

      // Extracted fields with synonyms to prevent sheet formatting mismatches
      const idNum = getVal(['id_number', 'idnumber', 'id']);
      const identity = getVal(['identity', 'name', 'unit']);
      const prodDate = getVal(['date_of_production', 'production_date', 'date']);
      const mathSci = getVal(['mathematics_scientific_ability', 'mathematics', 'math', 'scientific']);
      const linguistic = getVal(['linguistic_ability', 'linguistic', 'language']);
      const discipline = getVal(['discipline_obedience', 'discipline', 'obedience']);
      const physical = getVal(['physical_skill', 'physical']);
      const conformity = getVal(['social_conformity', 'conformity']);
      const intelligence = getVal(['overall_intelligence', 'intelligence']);
      const creativity = getVal(['creativity_individuality', 'creativity', 'individuality']);
      const notableTrait = getVal(['notable_trait', 'trait']);
      const areaConcern = getVal(['area_of_concern', 'concern']);

      // Threat condition: 6 or more stars out of 10
      const creativityMatch = creativity.match(/\d+/);
      const creativityScore = creativityMatch ? parseInt(creativityMatch[0], 10) : 0;
      const isSubversive = creativityScore >= 6;

      const appContainer = document.getElementById('app');
      if (isSubversive) {
        appContainer.classList.add('has-hazard');
      } else {
        appContainer.classList.remove('has-hazard');
      }

      appContainer.innerHTML = `
        <div class="system-header">
          <span>MINISTRY OF REPRODUCTION // REGISTRY</span>
          <span class="status-badge ${isSubversive ? 'hazard' : ''}">
            ${isSubversive ? '⚠ SUBVERSIVE HAZARD' : 'STANDARD MONITORED'}
          </span>
        </div>

        <div class="unit-meta">
          <div class="unit-identity">${identity !== '---' ? identity : 'DESIGNATION UNASSIGNED'}</div>
          
          <div class="meta-row">
            <div class="meta-item">
              <span>UNIT ID NUMBER</span>
              <strong>${idNum}</strong>
            </div>
            <div class="meta-item">
              <span>PRODUCTION DATE</span>
              <strong>${prodDate}</strong>
            </div>
          </div>
        </div>

        <div class="section-title">PSYCH-APTITUDE METRICS [OUT OF 10]</div>
        <div class="stat-list">
          <div class="stat-row">
            <span class="stat-label">Overall Intelligence</span>
            ${formatStars(intelligence)}
          </div>
          <div class="stat-row">
            <span class="stat-label">Discipline / Obedience</span>
            ${formatStars(discipline)}
          </div>
          <div class="stat-row">
            <span class="stat-label">Social Conformity</span>
            ${formatStars(conformity)}
          </div>
          <div class="stat-row">
            <span class="stat-label">Math & Scientific Ability</span>
            ${formatStars(mathSci)}
          </div>
          <div class="stat-row">
            <span class="stat-label">Linguistic Ability</span>
            ${formatStars(linguistic)}
          </div>
          <div class="stat-row">
            <span class="stat-label">Physical Skill</span>
            ${formatStars(physical)}
          </div>
          
          <!-- Creativity & Individuality Metric Row -->
          <div class="stat-row ${isSubversive ? 'creativity-alert' : ''}">
            <span class="stat-label">Creativity / Individuality</span>
            <div>
              ${formatStars(creativity)}
              ${isSubversive ? '<span class="warning-tag">[FLAGGED]</span>' : ''}
            </div>
          </div>
        </div>

        <div class="section-title">BEHAVIORAL APPRAISAL</div>

        ${isSubversive ? `
          <div class="alert-panel hazard-flag">
            <span class="label">CRITICAL RECONDITIONING ADVISORY</span>
            <p><strong>ALERT:</strong> Unit exhibits heightened creativity and individualist thought patterns (${creativityScore}/10 stars). Severe non-conformity threat. Recommend immediate cognitive realignment.</p>
          </div>
        ` : ''}

        <div class="alert-panel amber">
          <span class="label">NOTABLE TRAIT // RECORDED SPECIFICATION</span>
          <p>${notableTrait}</p>
        </div>

        <div class="alert-panel danger">
          <span class="label">AREA OF CONCERN // DEVIATION RISK</span>
          <p>${areaConcern}</p>
        </div>
      `;
    }

    async function loadCastData() {
      const targetId = getQueryParam('id') || getQueryParam('id_number');

      if (!targetId) {
        renderError("SCAN TAG REQUIRED", "No personnel identification code detected. Please scan an authorized unit tag.");
        return;
      }

      Papa.parse(SHEET_CSV_URL, {
        download: true,
        header: true,
        skipEmptyLines: true,
        transformHeader: function(h) {
          return h.replace(/^\ufeff/, '').trim().toLowerCase();
        },
        complete: function(results) {
          const records = results.data;
          const cleanTarget = decodeURIComponent(targetId).trim().toLowerCase();

          // Match 'id_number' or 'id'
          const matched = records.find(row => {
            const idKey = Object.keys(row).find(k => {
              const cleanedKey = k.replace(/[^a-z0-9]/g, '').toLowerCase();
              return cleanedKey === 'idnumber' || cleanedKey === 'id';
            });
            if (!idKey || row[idKey] === undefined || row[idKey] === null) return false;
            return row[idKey].toString().trim().toLowerCase() === cleanTarget;
          });

          if (matched) {
            renderDossier(matched);
          } else {
            console.warn("Parsed records from sheet:", records);
            renderError("SUBJECT NOT FOUND", `Unit ID [${targetId}] does not exist in production archives.`);
          }
        },
        error: function(err) {
          console.error(err);
          renderError("DATA STREAM OFFLINE", "Failed to retrieve archive from terminal network. Verify your Google Sheet publication link.");
        }
      });
    }

    window.addEventListener('DOMContentLoaded', loadCastData);
  </script>
</body>
</html>
